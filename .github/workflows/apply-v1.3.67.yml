name: Apply v1.3.67

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1.3.67.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply tested v1.3.67 patch
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/v1.3.67.patch
          patch torn-company-manager.user.js < /tmp/v1.3.67.patch
          node --check torn-company-manager.user.js
          rm .github/workflows/apply-v1.3.67.yml
          git config user.name 'ChatGPT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add torn-company-manager.user.js .github/workflows/apply-v1.3.67.yml
          git commit -m 'Release v1.3.67 inline employee profile and director name'
          git push
