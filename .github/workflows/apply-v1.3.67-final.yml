name: Apply v1.3.67 Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1.3.67-final.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Transform current v1.3.66 to v1.3.67
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path('torn-company-manager.user.js')
          text = p.read_text(encoding='utf-8')

          assert '// @version      1.3.66' in text, 'Expected v1.3.66 baseline not found'
          text = text.replace('// @version      1.3.66', '// @version      1.3.67', 1)
          text = text.replace("const TDS_VERSION_FALLBACK = '1.3.66';", "const TDS_VERSION_FALLBACK = '1.3.67';", 1)

          storage_anchor = "  const STORAGE_KEY_STAFFING_BENCHMARK_CACHE = 'tds_staffing_benchmark_cache_v1';\n"
          if "STORAGE_KEY_DIRECTOR_NAME_CACHE" not in text:
              assert storage_anchor in text, 'Storage anchor missing'
              text = text.replace(storage_anchor, storage_anchor + "  const STORAGE_KEY_DIRECTOR_NAME_CACHE = 'tds_director_name_cache_v1';\n", 1)

          for css in [
              "      .tds-profile-overlay { position:fixed; inset:0; z-index:2147483646; background:rgba(0,0,0,.58); display:flex; align-items:center; justify-content:center; padding:14px; }\n",
              "      .tds-profile-modal { width:min(560px,96vw); max-height:86vh; overflow:auto; background:var(--tds-bg-panel,#1f1f1f); border:1px solid var(--tds-border-strong,#4a4a4a); border-radius:10px; box-shadow:0 14px 40px rgba(0,0,0,.45); padding:14px; }\n",
              "      .tds-profile-head { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; margin-bottom:10px; }\n",
          ]:
              text = text.replace(css, '', 1)

          profile_block = r'''  function employeeRoleSummary(employee) {
            let roleSummary = 'Open Employee Effectiveness for detailed role analysis.';

            try {
              const profile = findRaw(state.lastResults, 'company', 'profile');
              const reference = findRaw(state.lastResults, 'torn', 'companies');
              const typeId = numericValue(findValueDeep(profile, ['company_type', 'type_id', 'type']));
              const typeName = resolveCompanyTypeName(reference, typeId);
              const positions = extractPositionRequirements(reference, typeId).map((position) => ({
                ...position,
                resolvedSpecial: resolvePositionSpecial(position, typeId, typeName),
              }));
              const row = positions.length ? buildEmployeePositionMatrix([employee], positions)[0] : null;
              if (row?.best?.position?.name) {
                roleSummary = `Best estimated role: ${row.best.position.name}${typeof row.best.estimate?.total === 'number' ? ` · ${formatNumber(row.best.estimate.total)} EE` : ''}`;
              }
            } catch (err) {
              console.warn('[TDS] Employee inline role summary unavailable:', err);
            }
            return roleSummary;
          }

          function openEmployeeDetail(panel, id, name) {
            const employee = findEmployeeByIdOrName(id, name);
            if (!employee) return;
            switchTab(panel, 'overview');
            const selector = employeeDeepLinkSelector(employee.id, employee.name);
            const tryOpen = (attempt = 0) => {
              const overview = panel.querySelector('[data-tabpanel="overview"]');
              const node = selector ? overview?.querySelector(selector) : null;
              const details = node?.closest('details.tds-employee-row') || node;
              if (details) {
                if (details.tagName === 'DETAILS') details.open = true;
                details.classList.add('tds-employee-deeplink-highlight');
                details.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => details.classList.remove('tds-employee-deeplink-highlight'), 5000);
                return;
              }
              if (attempt < 12) setTimeout(() => tryOpen(attempt + 1), 150);
            };
            setTimeout(() => tryOpen(), 0);
          }

'''
          pattern = r"  function openEmployeeDetail\(panel, id, name\) \{.*?\n  \}\n\n(?=  function bindEmployeeProfileLinks\(panel\))"
          text, n = re.subn(pattern, profile_block, text, count=1, flags=re.S)
          assert n == 1, 'Could not replace popup employee profile function'

          overview_row = "        html += companyOverviewRow(label, value, formatter);\n        if (row) shown.add(row.path);\n"
          overview_replacement = '''        if (label === 'Director') {
          html += `<div class="tds-row">
            <span class="tds-row-label">Director</span>
            <span class="tds-row-value" id="tds-director-value">${escapeHtml(formatter(value))}</span>
          </div>`;
          state.currentDirectorValue = value;
        } else {
          html += companyOverviewRow(label, value, formatter);
        }
        if (row) shown.add(row.path);
'''
          assert overview_row in text, 'Director Overview row anchor missing'
          text = text.replace(overview_row, overview_replacement, 1)

          employee_status_end = '''              ${status || lastAction ? `
                <div class="tds-section-label tds-employee-subheading" style="margin-top:10px;">Status</div>
                <div class="tds-row"><span class="tds-row-label">Online Status</span><span class="tds-row-value ${onlineMeta.textClass}">${escapeHtml(String(onlineStatus))}</span></div>
                <div class="tds-row"><span class="tds-row-label">State</span><span class="tds-row-value">${escapeHtml(String(playerState))}</span></div>
                <div class="tds-row"><span class="tds-row-label">Detail</span><span class="tds-row-value">${escapeHtml(String(stateDetail))}</span></div>
                <div class="tds-row"><span class="tds-row-label">Last action</span><span class="tds-row-value ${onlineMeta.textClass}">${escapeHtml(String(lastActionText))}</span></div>
              ` : ''}
            </div>
'''
          employee_status_new = '''              ${status || lastAction ? `
                <div class="tds-section-label tds-employee-subheading" style="margin-top:10px;">Status</div>
                <div class="tds-row"><span class="tds-row-label">Online Status</span><span class="tds-row-value ${onlineMeta.textClass}">${escapeHtml(String(onlineStatus))}</span></div>
                <div class="tds-row"><span class="tds-row-label">State</span><span class="tds-row-value">${escapeHtml(String(playerState))}</span></div>
                <div class="tds-row"><span class="tds-row-label">Detail</span><span class="tds-row-value">${escapeHtml(String(stateDetail))}</span></div>
                <div class="tds-row"><span class="tds-row-label">Last action</span><span class="tds-row-value ${onlineMeta.textClass}">${escapeHtml(String(lastActionText))}</span></div>
              ` : ''}

              <div class="tds-section-label tds-employee-subheading" style="margin-top:10px;">Role Summary</div>
              <div class="tds-box tds-box-neutral">${escapeHtml(employeeRoleSummary(employee))}</div>
              <div class="tds-profile-actions">
                <button class="tds-btn" data-inline-employee-tab="training" data-employee-id="${escapeHtml(String(employee.id))}" data-employee-name="${escapeHtml(String(employee.name))}">View in Training</button>
                <button class="tds-btn" data-inline-employee-tab="optimize" data-employee-id="${escapeHtml(String(employee.id))}" data-employee-name="${escapeHtml(String(employee.name))}">View in Employee Effectiveness</button>
              </div>
            </div>
'''
          assert employee_status_end in text, 'Employee collapsible status anchor missing'
          text = text.replace(employee_status_end, employee_status_new, 1)

          overview_end = '''    el.innerHTML = html;
    bindEmployeeProfileLinks(panel);
  }

  function escapeHtml(str) {
'''
          overview_end_new = '''    el.innerHTML = html;
    bindEmployeeProfileLinks(panel);

    if (state.currentDirectorValue !== undefined) {
      refreshDirectorName(panel, state.currentDirectorValue).catch((err) =>
        console.warn('[TDS] Director name refresh failed:', err)
      );
    }

    el.querySelectorAll('[data-inline-employee-tab]').forEach((button) => {
      button.addEventListener('click', (event) => {
        event.preventDefault();
        event.stopPropagation();
        const employee = findEmployeeByIdOrName(button.dataset.employeeId, button.dataset.employeeName);
        if (employee) focusEmployeeInTab(panel, button.dataset.inlineEmployeeTab, employee);
      });
    });
  }

  function escapeHtml(str) {
'''
          assert overview_end in text, 'Overview post-render anchor missing'
          text = text.replace(overview_end, overview_end_new, 1)

          director_block = r'''  function formatDirectorName(value, employees, results) {
            let directorId = null;
            let directorName = null;
            if (value && typeof value === 'object') {
              directorName = findValueDeep(value, ['name', 'player_name', 'username']);
              directorId = findValueDeep(value, ['id', 'player_id', 'user_id']);
            } else {
              directorId = value;
            }
            directorId = String(directorId ?? '').trim();
            if (!directorId) return directorName ? String(directorName) : '—';
            if (!directorName) {
              const rosterMatch = (employees || []).find((employee) => String(employee.id) === directorId);
              if (rosterMatch?.name && !String(rosterMatch.name).startsWith('#')) directorName = String(rosterMatch.name);
            }
            if (!directorName) {
              const basic = findRaw(results, 'user', 'basic');
              const basicId = basic && findValueDeep(basic, ['player_id', 'user_id', 'id']);
              const basicName = basic && findValueDeep(basic, ['name', 'player_name', 'username']);
              if (basicId !== null && String(basicId) === directorId && basicName) directorName = String(basicName);
            }
            if (!directorName) {
              const cached = GM_getValue(STORAGE_KEY_DIRECTOR_NAME_CACHE, null);
              if (cached && String(cached.id || '') === directorId && cached.name && Date.now() - Number(cached.timestamp || 0) < 86400000) directorName = String(cached.name);
            }
            return directorName ? `${directorName} [${directorId}]` : directorId;
          }

          async function refreshDirectorName(panel, directorValue) {
            let directorId = directorValue;
            if (directorValue && typeof directorValue === 'object') {
              const existingName = findValueDeep(directorValue, ['name', 'player_name', 'username']);
              const objectId = findValueDeep(directorValue, ['id', 'player_id', 'user_id']);
              if (existingName && objectId !== null) return;
              directorId = objectId;
            }
            directorId = String(directorId ?? '').trim();
            if (!directorId || !/^\d+$/.test(directorId)) return;
            const target = panel.querySelector('#tds-director-value');
            if (!target || /\[\d+\]$/.test(target.textContent || '')) return;
            const cached = GM_getValue(STORAGE_KEY_DIRECTOR_NAME_CACHE, null);
            if (cached && String(cached.id || '') === directorId && cached.name && Date.now() - Number(cached.timestamp || 0) < 86400000) {
              target.textContent = `${cached.name} [${directorId}]`;
              return;
            }
            try {
              const data = await ApiClient.call('user', 'basic', directorId);
              const name = findValueDeep(data, ['name', 'player_name', 'username']);
              if (!name) return;
              GM_setValue(STORAGE_KEY_DIRECTOR_NAME_CACHE, { id: directorId, name: String(name), timestamp: Date.now() });
              const current = panel.querySelector('#tds-director-value');
              if (current) current.textContent = `${name} [${directorId}]`;
            } catch (err) {
              console.warn('[TDS] Director name lookup unavailable:', err);
            }
          }

'''
          pattern = r"  function formatDirectorName\(value, employees, results\) \{.*?\n  \}\n\n(?=  function formatCompanyType\(value, results\))"
          text, n = re.subn(pattern, director_block, text, count=1, flags=re.S)
          assert n == 1, 'Could not replace Director formatter'

          p.write_text(text, encoding='utf-8')
          PY

          node --check torn-company-manager.user.js
          git diff --check
          grep -q '@version      1.3.67' torn-company-manager.user.js
          grep -q "TDS_VERSION_FALLBACK = '1.3.67'" torn-company-manager.user.js
          grep -q 'employeeRoleSummary' torn-company-manager.user.js
          grep -q 'refreshDirectorName' torn-company-manager.user.js

      - name: Commit v1.3.67 userscript only
        shell: bash
        run: |
          git config user.name 'ChatGPT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add torn-company-manager.user.js
          git commit -m 'Release v1.3.67 inline employee profile and director name'
          git push
