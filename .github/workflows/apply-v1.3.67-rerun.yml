name: Apply v1.3.67 Rerun

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v1.3.67-rerun.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rebuild and apply tested v1.3.67 patch
        shell: bash
        run: |
          awk '/^          cat > \/tmp\/v1367.patch <<'"'"'PATCH'"'"'$/ {capture=1; next} /^PATCH$/ {capture=0} capture {sub(/^          /, ""); print}' .github/workflows/apply-v1.3.67.yml > /tmp/v1367.patch
          test -s /tmp/v1367.patch
          git apply --check /tmp/v1367.patch
          git apply /tmp/v1367.patch
          node --check torn-company-manager.user.js
          rm .github/workflows/apply-v1.3.67.yml .github/workflows/apply-v1.3.67-rerun.yml
          git config user.name 'ChatGPT Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add torn-company-manager.user.js .github/workflows/apply-v1.3.67.yml .github/workflows/apply-v1.3.67-rerun.yml
          git commit -m 'Release v1.3.67 inline employee profile and director name'
          git push
